<section class="catalog">
    <header class = "catalog__header">
        <div>
            <p class="catalog__eyebrow">Diario de cine</p>
            <h1> Explora películas</h1>
            <p class="catalog__subtitle">
                Puntua, descubre y organiza las películas que vas viendo.
            </p>
        </div>

        <label class="catalog__search">
            <span>Buscar</span>
            <input
                type="search"
                placeholder="Titulo, director o genero"
                [value] = "searchTerm()" 
                (input)="updateSearchTerm($any($event.target).value)"
            />
        </label>

        <div class="catalog__filters" aria-label="Filtro de estado">
            <button
                type="button"
                [class.is-active] = "watchFilter() === 'all'"
                (click)="updateWatchFilter('all')"
            >
                Todas ({{moviesStats().total}})
            </button>

            <button
                type="button"
                [class.is-active] = "watchFilter() === 'watched'"
                (click)="updateWatchFilter('watched')"
            >
                Vistas ({{moviesStats().watched}})
            </button>

            <button
                type="button"
                [class.is-active] = "watchFilter() === 'Not watched'"
                (click)="updateWatchFilter('Not watched')"
            >
                No vistas ({{moviesStats().notWatched}})
            </button>

            <button
                type="button"
                [class.is-active] = "watchFilter() === 'pending'"
                (click)="updateWatchFilter('pending')"
            >
                Pendientes ({{moviesStats().pending}})
            </button>
        </div>

        <div class="catalog__genre-filter">
            <label for="genre-filter">Genero</label>

            <select
                id="genre-filter"
                [value]="selectedGenre()"
                (change)="updateSelectedGenre($any($event.target).value)"
            >
                @for (genre of availableGenres(); track genre) {
                    <option [value]="genre">
                        {{genre === 'all' ? 'Todos los generos': genre}}
                    </option>
                }
            </select>
        </div>

        <div class="catalog__sort">
            <label for="sort-by">Ordenar por</label>

            <select
                id="sort-by"
                [value]="sortBy()"
                (change)="updateSortBy($any($event.target).value)"
            >
                <option value="title">Título</option>
                <option value="year">Año</option>
                <option value="average-rating">Nota media</option>
                <option value="most-voted">Mas votadas</option>
                <option value="user-rating">Mi puntuación</option>
            </select>
        </div>
    </header>

    <div class="catalog__grid">
        @for (movie of filteredMovies(); track movie.id) {
            <app-movie-card 
            [movie]="movie" 
            (ratingSelected)="rateMovie(movie.id, $event)"
            (watchedToggled)="toggleWatched(movie.id)"
            (pendingToggled)="togglePending(movie.id)"
            />
        } @empty {
            <p class="catalog__empty"> No hay películas que coincidan con la búsqueda.</p>
        }
    </div>
</section>
